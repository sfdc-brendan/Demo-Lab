<template>
    <lightning-card class="sr-card">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <template if:true={hasError}>
                <div class="sr-error">{errorMessage}</div>
            </template>

            <template if:true={noData}>
                <div class="sr-unknown">
                    <span class="sr-unknown__dot"></span>
                    <span>{emptyMessage}</span>
                </div>
            </template>

            <template if:true={hasData}>

                <div class="sr-head">
                    <div class="sr-head__title">
                        <lightning-icon icon-name="utility:socialshare" size="x-small"></lightning-icon>
                        <span>Fiber availability</span>
                    </div>
                    <span class={statusClass}>{data.statusLabel}</span>
                </div>

                <div class="sr-headline">{data.headline}</div>
                <div class="sr-location">{location}</div>

                <p class="sr-summary">{data.summary}</p>

                <template if:true={showSpeedJump}>
                    <div class="sr-jump">
                        <div class="sr-jump__side">
                            <span class="sr-jump__tag">Today</span>
                            <span class="sr-jump__value">{currentSpeedLabel}</span>
                        </div>
                        <lightning-icon
                            class="sr-jump__arrow"
                            icon-name="utility:forward"
                            size="x-small">
                        </lightning-icon>
                        <div class="sr-jump__side sr-jump__side_to">
                            <span class="sr-jump__tag">{data.recommendedPlan}</span>
                            <span class="sr-jump__value">{upgradeSpeedLabel}</span>
                        </div>
                        <template if:true={data.speedMultiplier}>
                            <span class="sr-jump__badge">{data.speedMultiplier} faster</span>
                        </template>
                    </div>
                </template>

                <template if:true={hasFacts}>
                    <div class="sr-facts slds-m-top_medium">
                        <template for:each={facts} for:item="f">
                            <div key={f.id} class="sr-fact">
                                <span class="sr-fact__label">{f.label}</span>
                                <span class="sr-fact__value">{f.value}</span>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:true={hasPromo}>
                    <div class="sr-promo slds-m-top_medium">
                        <lightning-icon
                            icon-name="utility:tag"
                            size="xx-small"
                            variant="inverse">
                        </lightning-icon>
                        <span class="sr-promo__text">{promoText}</span>
                    </div>
                </template>

                <div class="sr-reco slds-m-top_medium">
                    <div class="sr-reco__label">Recommended next step</div>
                    <p class="sr-reco__text">{data.recommendation}</p>
                </div>

                <template if:true={isServiceable}>
                    <div class="sr-actions slds-m-top_medium">
                        <lightning-button
                            variant="brand"
                            label={explainLabel}
                            data-message={explainMessage}
                            disabled={replySent}
                            onclick={handleExplain}>
                        </lightning-button>
                        <lightning-button
                            label="Compare plans"
                            data-message={comparePlansMessage}
                            onclick={handlePost}>
                        </lightning-button>
                    </div>
                </template>

            </template>
        </div>
    </lightning-card>
</template>
