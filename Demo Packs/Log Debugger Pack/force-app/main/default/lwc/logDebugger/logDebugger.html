<template>
  <!--
    The icon lives in the title slot rather than the card's icon-name attribute:
    lightning-card drops icon-name entirely once a title slot is supplied.
  -->
  <lightning-card>
    <h2
      slot="title"
      class="slds-card__header-title slds-grid slds-grid_vertical-align-center"
    >
      <lightning-icon
        icon-name="utility:bug"
        size="small"
        alternative-text=""
        aria-hidden="true"
        class="slds-var-m-right_x-small"
      ></lightning-icon>
      <span class="slds-text-heading_small">Log Debugger</span>
      <lightning-badge
        label="Claude"
        class="slds-badge_lightest slds-var-m-left_x-small"
      ></lightning-badge>
    </h2>

    <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
      <!-- Upload -->
      <template if:true={showUpload}>
        <p class="slds-text-body_regular slds-var-m-bottom_small">
          Attach the cluster or job log from the customer. The log is reduced to
          its error signal, classified, matched against the knowledge
          base, and turned into troubleshooting steps you can work through with
          them.
        </p>
        <lightning-file-upload
          label="Upload a log file"
          name="logUpload"
          accept={acceptedFormats}
          record-id={recordId}
          onuploadfinished={handleUploadFinished}
        ></lightning-file-upload>
        <p
          class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small"
        >
          Accepts .log, .txt, .out, and .err up to 1 MB.
        </p>
      </template>

      <!-- Uploaded file -->
      <template if:true={showFileCard}>
        <div
          class="slds-box slds-box_x-small slds-var-m-bottom_small log-filecard"
        >
          <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
            <lightning-icon
              icon-name="doctype:txt"
              size="small"
              alternative-text="Log file"
            ></lightning-icon>
            <div class="slds-col slds-var-m-left_x-small slds-grow">
              <p class="slds-text-body_regular slds-text-title_bold">
                {fileName}
              </p>
              <template if:true={digestSummary}>
                <p class="slds-text-body_small slds-text-color_weak">
                  {digestSummary}
                </p>
              </template>
            </div>
            <lightning-button
              label="Analyze"
              variant="brand"
              disabled={analyzeDisabled}
              onclick={handleAnalyze}
              class="slds-var-m-left_x-small"
            ></lightning-button>
            <lightning-button
              label="Start over"
              variant="neutral"
              disabled={isBusy}
              onclick={handleStartOver}
              class="slds-var-m-left_xx-small"
            ></lightning-button>
          </div>
        </div>
      </template>

      <!--
        Scoped notification rather than slds-notify_alert: this failure belongs to
        the component, not the page, and the alert blueprint is a page-level bar.
      -->
      <template if:true={errorMessage}>
        <div
          class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-var-m-bottom_small"
          role="alert"
        >
          <div class="slds-media__figure">
            <lightning-icon
              icon-name="utility:error"
              variant="inverse"
              size="small"
              alternative-text="Error"
            ></lightning-icon>
          </div>
          <div class="slds-media__body">
            <p>{errorMessage}</p>
          </div>
        </div>
      </template>

      <!-- Staged progress -->
      <template if:true={showProgress}>
        <ul class="slds-var-m-bottom_small" aria-live="polite">
          <template for:each={stages} for:item="stage">
            <li key={stage.key} class={stage.itemClass}>
              <div class="slds-grid slds-grid_vertical-align-center">
                <template if:true={stage.running}>
                  <div class="log-stage__spinner">
                    <lightning-spinner
                      size="xx-small"
                      variant="brand"
                      alternative-text="Working"
                    ></lightning-spinner>
                  </div>
                </template>
                <template if:false={stage.running}>
                  <lightning-icon
                    icon-name={stage.iconName}
                    size="xx-small"
                    alternative-text=""
                  ></lightning-icon>
                </template>
                <span class="slds-var-m-left_small slds-text-body_regular"
                  >{stage.label}</span
                >
              </div>
            </li>
          </template>
        </ul>
      </template>

      <!-- Triage -->
      <template if:true={showTriage}>
        <div class="slds-box slds-box_xx-small slds-var-m-bottom_small">
          <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
            <h3 class="slds-text-heading_x-small slds-grow">
              {triageResult.signature}
            </h3>
            <lightning-badge
              label={triageResult.component}
              class="slds-var-m-left_xx-small"
            ></lightning-badge>
            <lightning-badge
              label={triageResult.severity}
              class={severityClass}
            ></lightning-badge>
          </div>
          <p class="slds-text-body_regular slds-var-m-top_x-small">
            {triageResult.summary}
          </p>

          <template if:true={triageResult.evidence.length}>
            <p
              class="slds-text-title_caps slds-text-color_weak slds-var-m-top_small slds-var-m-bottom_xx-small"
            >
              Evidence from the log
            </p>
            <template for:each={triageResult.evidence} for:item="line">
              <pre key={line} class="log-code log-code_evidence">{line}</pre>
            </template>
          </template>

          <lightning-button
            label={digestToggleLabel}
            variant="base"
            onclick={handleToggleDigest}
            class="slds-var-m-top_x-small"
          ></lightning-button>
          <template if:true={showDigest}>
            <pre class="log-code log-code_digest">
{triageResult.digest.preview}</pre>
          </template>
        </div>
      </template>

      <!-- Knowledge matches -->
      <template if:true={hasArticles}>
        <p
          class="slds-text-title_caps slds-text-color_weak slds-var-m-bottom_xx-small"
        >
          Knowledge base matches
        </p>
        <ul class="slds-var-m-bottom_small">
          <template for:each={articles} for:item="article">
            <li key={article.externalId} class="log-article">
              <div class="slds-grid slds-grid_vertical-align-start">
                <lightning-input
                  type="checkbox"
                  label={article.externalId}
                  variant="label-hidden"
                  checked={article.selected}
                  data-external-id={article.externalId}
                  onchange={handleArticleToggle}
                ></lightning-input>
                <div class="slds-col slds-grow slds-var-m-left_x-small">
                  <p class="slds-text-body_regular">
                    <span class="slds-text-title_bold"
                      >{article.externalId}</span
                    >
                    &nbsp;{article.title}
                  </p>
                  <span class="slds-assistive-text">{article.matchLabel}</span>
                  <lightning-progress-bar
                    value={article.matchPercent}
                    size="small"
                  ></lightning-progress-bar>
                </div>
              </div>
            </li>
          </template>
        </ul>
        <template if:true={showAnalysis}>
          <lightning-button
            label="Re-run with the selected articles"
            variant="neutral"
            disabled={resynthesizeDisabled}
            onclick={handleResynthesize}
            class="slds-var-m-bottom_small"
          ></lightning-button>
        </template>
      </template>

      <!-- Analysis -->
      <template if:true={showAnalysis}>
        <div class="slds-box slds-box_x-small log-analysis">
          <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
            <h3 class="slds-text-heading_small slds-grow">Root cause</h3>
            <lightning-badge
              label={confidenceLabel}
              class={confidenceClass}
            ></lightning-badge>
          </div>
          <p class="slds-text-body_regular slds-var-m-top_xx-small">
            {analysis.rootCause}
          </p>
          <p
            class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small"
          >
            {analysis.confidenceReason}
          </p>

          <h3 class="slds-text-heading_small slds-var-m-top_medium">
            Troubleshooting steps
          </h3>
          <ol class="log-steps">
            <template for:each={decoratedSteps} for:item="step">
              <li key={step.position} class="log-step">
                <div class="slds-grid slds-grid_vertical-align-center">
                  <span class="log-step__number">{step.position}</span>
                  <span
                    class="slds-text-title_bold slds-var-m-left_x-small slds-grow"
                    >{step.action}</span
                  >
                  <template if:true={step.hasSource}>
                    <lightning-badge
                      label={step.sourceArticle}
                      class="slds-var-m-left_xx-small"
                    ></lightning-badge>
                  </template>
                </div>
                <p class="slds-text-body_regular slds-var-m-top_xx-small">
                  {step.detail}
                </p>
                <template if:true={step.hasCommand}>
                  <div class="log-command">
                    <pre class="log-code">{step.command}</pre>
                    <lightning-button-icon
                      icon-name="utility:copy_to_clipboard"
                      variant="bare"
                      alternative-text="Copy command"
                      title="Copy command"
                      data-copy={step.command}
                      onclick={handleCopy}
                    ></lightning-button-icon>
                  </div>
                </template>
                <p class="slds-text-body_small slds-text-color_weak">
                  Expected: {step.expected}
                </p>
              </li>
            </template>
          </ol>

          <template if:true={hasCitations}>
            <h3 class="slds-text-heading_small slds-var-m-top_medium">
              Grounded in
            </h3>
            <ul class="slds-list_dotted">
              <template for:each={analysis.citedArticles} for:item="cited">
                <li key={cited.externalId} class="slds-text-body_small">
                  {cited.externalId} &mdash; {cited.title}
                </li>
              </template>
            </ul>
          </template>

          <template if:true={analysis.escalation}>
            <h3 class="slds-text-heading_small slds-var-m-top_medium">
              If unresolved
            </h3>
            <p class="slds-text-body_regular">{analysis.escalation}</p>
          </template>

          <template if:true={analysis.customerReply}>
            <h3 class="slds-text-heading_small slds-var-m-top_medium">
              Draft reply to the customer
            </h3>
            <div class="log-command">
              <p class="slds-text-body_regular slds-grow">
                {analysis.customerReply}
              </p>
              <lightning-button-icon
                icon-name="utility:copy_to_clipboard"
                variant="bare"
                alternative-text="Copy reply"
                title="Copy reply"
                data-copy={analysis.customerReply}
                onclick={handleCopy}
              ></lightning-button-icon>
            </div>
          </template>

          <div
            class="slds-grid slds-grid_vertical-align-center slds-wrap slds-var-m-top_medium"
          >
            <lightning-input
              type="toggle"
              label="Also post to the case feed"
              checked={postToChatter}
              onchange={handleChatterToggle}
              class="slds-grow"
            ></lightning-input>
            <lightning-button
              label="Save to case"
              variant="brand"
              disabled={saving}
              onclick={handleSave}
            ></lightning-button>
          </div>

          <p
            class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small"
          >
            Generated by {analysis.modelUsed}. Review before sending to a
            customer.
          </p>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
